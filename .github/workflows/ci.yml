name: Docker Build and Push CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mysite:${{ github.sha }} .
    - name: Push to Docker Hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/mysite:${{ github.sha }}
    - name: Test container locally
      run: |
        docker run -d --name test-container -p 8080:80 ${{ secrets.DOCKER_USERNAME }}/mysite:${{ github.sha }}
        sleep 5
        curl -f http://localhost:8080 || exit 1
        docker stop test-container
        docker rm test-container
